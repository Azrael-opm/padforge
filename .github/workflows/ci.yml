name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Platform-independent core (engine, config, mouse curve, macros, keys).
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --lib --locked

  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --lib --locked
      - name: Release build
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/padforge.exe dist/
          Copy-Item README.md, LICENSE, CHANGELOG.md dist/
          $hash = (Get-FileHash dist/padforge.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  padforge.exe" | Out-File -Encoding ascii dist/padforge.exe.sha256
          Get-Content dist/padforge.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: padforge-windows-x64
          path: dist/
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: padforge-windows-x64
          path: dist
      - name: Zip
        run: |
          cd dist
          zip -9 "../padforge-${GITHUB_REF_NAME}-windows-x64.zip" padforge.exe padforge.exe.sha256 README.md LICENSE CHANGELOG.md
      - name: Release notes from CHANGELOG
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '
            $0 ~ "^## \\[?"v"\\]?" {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            dist/padforge.exe
            dist/padforge.exe.sha256
            padforge-*-windows-x64.zip
